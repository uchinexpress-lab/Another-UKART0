<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2E7D32" />
    <title>Ukart</title>
    <script>
      // Switch to the Rider app identity (manifest, title, theme color) when
      // the URL is under /rider/*. This lets the Rider PWA install and the
      // Android wrapper carry the "Ukart Rider" name and icon instead of the
      // customer app's.
      (function () {
        if (window.location.pathname.startsWith('/rider')) {
          var m = document.querySelector('link[rel="manifest"]');
          if (m) m.setAttribute('href', '/rider-manifest.json');
          document.title = 'Ukart Rider';
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#1B4332');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
